name: Test basic usage - default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default inputs
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran (not a missing file / setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because there is no PR context under
          # workflow_dispatch, but it must NOT fail due to a missing dist/index.js
          # or a Node.js setup error. Any outcome other than 'skipped' is acceptable.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
