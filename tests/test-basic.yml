name: Test basic usage - unsupported event exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with default inputs
        id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_MODEL: gpt-4o
          LLM_API_KEY: fake-key-for-testing
        # All inputs have defaults.
        # GITHUB_TOKEN, LLM_MODEL, and LLM_API_KEY are set so Config initializes without error.
        # Under workflow_dispatch, GITHUB_EVENT_NAME is not pull_request,
        # so the action emits a warning and exits 0 (graceful skip).
      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (graceful skip for unsupported event)"
          echo "PASS"
