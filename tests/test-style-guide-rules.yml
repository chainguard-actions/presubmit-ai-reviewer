name: Test custom style guide rules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          style_guide_rules: |
            - Use camelCase for variable names
            - Avoid magic numbers; use named constants
            - All functions must have JSDoc comments
          github_api_url: 'https://api.github.com'
          github_server_url: 'https://github.com'
      - name: Assert action ran with style guide rules (not a hard crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there is no PR context under workflow_dispatch,
          # but it should not produce an unexpected outcome type.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
