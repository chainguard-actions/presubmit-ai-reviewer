name: Test GitHub Enterprise Server URLs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/7/merge
      GITHUB_HEAD_REF: feature-enterprise
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          style_guide_rules: ''
          github_api_url: 'https://github.example.com/api/v3'
          github_server_url: 'https://github.example.com'
      - name: Assert action was invoked with enterprise URLs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing API credentials or unreachable
          # enterprise server, but it should not fail due to input validation
          # errors for custom github_api_url / github_server_url.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action was invoked with enterprise URLs, outcome=$OUTCOME"
